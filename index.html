<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Гуль-забег</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;color-scheme:dark}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 4px #000}
#sc{font-size:30px;font-weight:900}
#cn{font-size:20px;font-weight:800;color:#ffd24a;text-align:right}
#pw{font-size:16px;margin-top:2px}
#mu{pointer-events:auto;background:#0008;border:0;color:#fff;font-size:20px;border-radius:50%;width:38px;height:38px;margin-top:4px}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(15,0,15,.6);padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.ui h1{font-size:40px;margin:0 0 6px;color:#ff3050;text-shadow:0 0 18px #ff1030,0 3px 0 #000;letter-spacing:1px}
.ui p{margin:4px 0;color:#ddd}
.ui button{margin-top:18px;background:#e0182f;color:#fff;border:0;border-radius:14px;padding:14px 36px;font-size:20px;font-weight:800;box-shadow:0 5px 0 #7d0b19}
.ui button:active{transform:translateY(3px);box-shadow:0 2px 0 #7d0b19}
.hide{display:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><div id="sc">0</div><div id="pw"></div></div><div><div id="cn">🪙 0</div><button id="mu">🔊</button></div></div>
<div class="ui" id="menu"><h1>ГУЛЬ-ЗАБЕГ</h1><p>Беги по рельсам Саратова от зомби!</p><p>Свайпы: ← → смена полосы, ↑ прыжок, ↓ подкат</p><p id="mb"></p><button onclick="start()">БЕЖАТЬ</button></div>
<div class="ui hide" id="over"><h1>ПОЙМАЛИ!</h1><p id="os" style="font-size:26px;font-weight:800"></p><p id="ob"></p><button onclick="start()">ЕЩЁ РАЗ</button></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d');
let W,H,hy,py,LW,U,best=0,bank=0;
try{best=+localStorage.getItem('gr_best')||0;bank=+localStorage.getItem('gr_coins')||0}catch(e){}
const K=.035,sc=z=>1/(1+z*K),X=(l,z)=>W/2+(l-1)*LW*sc(z),Y=z=>hy+(py-hy)*sc(z);
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);hy=H*.3;py=H*.8;LW=Math.min(W*.27,H*.2);U=LW*.55}
addEventListener('resize',rs);rs();
/* ---------- генерация текстур ---------- */
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return c};
const PAT={asp:g.createPattern(mk(96,96,x=>{for(let i=0;i<1400;i++){const v=Math.random()*255|0;x.fillStyle=`rgba(${v},${v},${v},.3)`;x.fillRect(Math.random()*96,Math.random()*96,1.6,1.6)}}),'repeat'),
brick:g.createPattern(mk(32,16,x=>{x.strokeStyle='rgba(0,0,0,.55)';x.lineWidth=1.5;for(let r=0;r<2;r++){const y=r*8;x.beginPath();x.moveTo(0,y);x.lineTo(32,y);x.stroke();for(let c=0;c<2;c++){const xx=c*16+(r?8:0);x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+8);x.stroke()}}}),'repeat')};
const STARS=Array.from({length:50},()=>[Math.random(),Math.random()*.9,Math.random()*1.6+.4]);
const hash=n=>{const x=Math.sin(n*127.1)*43758.5;return x-Math.floor(x)};
/* ---------- звук ---------- */
let AC,MG,muted=false,step=0;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
function tone(f,d,ty='square',v=.12,f2,w=0){if(!AC||muted)return;const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime+w;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(MG);o.start(t);o.stop(t+d+.02)}
function noi(d,v=.15,fq=1500){if(!AC||muted)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();s.buffer=b;f.type='highpass';f.frequency.value=fq;gn.gain.value=v;s.connect(f);f.connect(gn);gn.connect(MG);s.start()}
const SFX={coin:()=>{tone(988,.07,'square',.09);tone(1480,.14,'square',.09,0,.06)},jump:()=>tone(280,.22,'square',.1,700),slide:()=>noi(.25,.18,1800),lane:()=>tone(520,.05,'triangle',.08),
hit:()=>{tone(180,.45,'sawtooth',.22,40);noi(.3,.25,300)},pu:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.08,0,i*.07)),over:()=>{tone(420,.8,'sawtooth',.2,50);tone(210,.9,'square',.12,30,.1)},grow:()=>tone(80,.5,'sawtooth',.08,45)};
const sfx=n=>{try{SFX[n]()}catch(e){}};
const BASS=[55,55,65,55,73,65,55,49],LEAD=[220,0,262,0,330,294,262,0,247,0,294,0,330,392,330,0];
setInterval(()=>{if(!AC||muted||st=='menu'&&false)return;const s=step++,spdF=st=='play'?1:.6;
 if(s%4==0)tone(130,.12,'sine',.28,40);if(s%2==1)noi(.04,.06,6000);
 if(s%2==0)tone(BASS[(s>>1)%8],.2,'sawtooth',.07);
 const l=LEAD[s%16];if(l)tone(l,.18,'triangle',.06*spdF)},200);
/* ---------- состояние ---------- */
let st='menu',dist=0,spd=14,coins=0,score=0,E=[],PT=[],P,gap=8,zl=1,inv=0,mag=0,shd=0,shake=0,nextZ=40,tt=0,lastS=-1,lastC=-1;
function reset(){dist=0;spd=30;coins=0;score=0;E=[];PT=[];P={l:1,x:1,h:0,vy:0,sl:0};gap=8;zl=1;inv=0;mag=0;shd=0;shake=0;nextZ=40}
reset();spd=14;
function start(){au();reset();st='play';$('#menu').classList.add('hide');$('#over').classList.add('hide');sfx('pu')}
function die(){st='over';gap=2.2;shake=.6;sfx('over');if(score>best)best=score;bank+=coins;try{localStorage.setItem('gr_best',best);localStorage.setItem('gr_coins',bank)}catch(e){}
 setTimeout(()=>{$('#os').textContent='Счёт: '+score+'  🪙'+coins;$('#ob').textContent='Рекорд: '+best+'   Всего монет: '+bank;$('#over').classList.remove('hide')},900)}
function burst(x,y,n,col){for(let i=0;i<n;i++)PT.push({x,y,vx:(Math.random()-.5)*240,vy:-Math.random()*260,l:.6+Math.random()*.4,c:col,r:2+Math.random()*3})}
function crash(){if(shd>0){shd=0;inv=1.2;sfx('hit');burst(W/2+(P.x-1)*LW,py-U,16,'#6cf');return}
 if(gap>5){gap=3.2;inv=1.6;shake=.5;sfx('hit');sfx('grow');burst(W/2+(P.x-1)*LW,py-U,20,'#f33');try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}else die()}
/* ---------- генерация препятствий ---------- */
function ob(l,z,t){t=t||(Math.random()<.35?'bar':Math.random()<.5?'hang':'train');const len=t=='train'?14+Math.random()*14|0:t=='bar'?1.2:1;E.push({t,l,z,len,y:0});return len}
function cl(l,z,n,y=.6){for(let i=0;i<n;i++)E.push({t:'c',l,z:z+i*2.2,len:.3,y,ph:i})}
function spawn(){const z=150,r=Math.random(),ls=[0,1,2],f=ls.splice(Math.random()*3|0,1)[0];let m=0;
 if(r<.3){m=ob(ls[0],z);cl(f,z,6)}
 else if(r<.58){m=Math.max(ob(ls[0],z),ob(ls[1],z));cl(f,z,6)}
 else if(r<.74){E.push({t:'bar',l:f,z:z+6,len:1.2,y:0});for(let i=0;i<7;i++)E.push({t:'c',l:f,z:z+i*1.6+1.5,len:.3,y:.6+Math.sin(Math.PI*i/6)*1.1,ph:i});m=ob(ls[0],z,'hang')}
 else if(r<.9){m=ob(ls[0],z,'train');cl(f,z,Math.max(6,m/2.2|0));ob(ls[1],z+8,'bar')}
 else{E.push({t:Math.random()<.5?'m':'s',l:f,z,len:.3,y:.7});m=ob(ls[0],z)}
 nextZ=Math.max(Math.max(18,36-dist/200),m+8)}
/* ---------- управление ---------- */
function act(a){au();if(st!='play')return;
 if(a=='L'&&P.l>0){P.l--;sfx('lane')}else if(a=='R'&&P.l<2){P.l++;sfx('lane')}
 else if(a=='U'&&P.h<=0){P.vy=9;P.sl=0;sfx('jump')}
 else if(a=='D'){if(P.h>0)P.vy=-16;else{P.sl=.7;sfx('slide')}}}
let sx,sy,fired=true;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;fired=false;au()});
cv.addEventListener('pointermove',e=>{if(fired)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<26&&Math.abs(dy)<26)return;fired=true;act(Math.abs(dx)>Math.abs(dy)?dx<0?'L':'R':dy<0?'U':'D')});
addEventListener('keydown',e=>{const m={ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',ArrowUp:'U',w:'U',' ':'U',ArrowDown:'D',s:'D'}[e.key];if(m){act(m);e.preventDefault()}});
$('#mu').onclick=()=>{au();muted=!muted;$('#mu').textContent=muted?'🔇':'🔊'};
/* ---------- обновление ---------- */
function update(dt){tt+=dt;if(shake>0)shake-=dt;
 if(st=='menu'){dist+=spd*dt;return}
 if(st=='over'){PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.l-=dt});PT=PT.filter(p=>p.l>0);return}
 spd=Math.min(62,spd+dt*.4);dist+=spd*dt;score=Math.floor(dist/2)+coins*10;
 P.x+=(P.l-P.x)*Math.min(1,dt*14);
 if(P.h>0||P.vy>0){P.vy-=26*dt;P.h+=P.vy*dt;if(P.h<=0){P.h=0;P.vy=0;burst(W/2+(P.x-1)*LW,py,5,'#999')}}
 if(P.sl>0)P.sl-=dt;inv=Math.max(0,inv-dt);mag=Math.max(0,mag-dt);shd=Math.max(0,shd-(shd>0?dt:0));
 gap=Math.min(8.5,gap+dt*.45);zl+=(P.x-zl)*Math.min(1,dt*5);
 if(gap<4&&Math.random()<dt*.5)sfx('grow');
 nextZ-=spd*dt;if(nextZ<=0)spawn();
 for(const e of E){e.z-=spd*dt;if(e.dead)continue;
  if(e.t=='c'||e.t=='m'||e.t=='s'){
   if(mag>0&&e.t=='c'&&e.z<16&&e.z>-1){e.l+=(P.x-e.l)*Math.min(1,dt*8);e.y+=(P.h+.8-e.y)*Math.min(1,dt*8);e.z-=dt*14}
   if(e.z<1&&e.z>-1&&Math.abs(P.x-e.l)<.6&&Math.abs(P.h+.8-e.y)<1){e.dead=1;
    if(e.t=='c'){coins++;sfx('coin');burst(X(e.l,0),py-(e.y+P.h)*U*.5,5,'#fd4')}
    else{if(e.t=='m')mag=8;else shd=10;sfx('pu');burst(W/2,py-U,14,'#8ff')}}
  }else if(!inv&&e.z<.7&&e.z+e.len>-.7&&Math.abs(P.x-e.l)<.55){
   if(e.t=='bar'&&P.h>.55)continue;if(e.t=='hang'&&P.sl>0)continue;crash()}}
 E=E.filter(e=>!e.dead&&e.z+e.len>-6);
 if(st=='play'&&Math.random()<dt*14&&P.h<=0)PT.push({x:W/2+(P.x-1)*LW+(Math.random()-.5)*20,y:py,vx:(Math.random()-.5)*40,vy:-30,l:.35,c:'#8886',r:2});
 PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.l-=dt});PT=PT.filter(p=>p.l>0)}
/* ---------- рисование ---------- */
function poly(p,c){g.fillStyle=c;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function sky(){const gr=g.createLinearGradient(0,0,0,hy+4);gr.addColorStop(0,'#08040f');gr.addColorStop(.6,'#3a1a4a');gr.addColorStop(1,'#c4603c');g.fillStyle=gr;g.fillRect(0,0,W,hy+4);
 g.fillStyle='#fff';STARS.forEach(s=>{g.globalAlpha=.4+.4*Math.sin(tt*2+s[0]*50);g.fillRect(s[0]*W,s[1]*hy*.8,s[2],s[2])});g.globalAlpha=1;
 g.fillStyle='#f4ecd8';g.beginPath();g.arc(W*.76,hy*.42,Math.min(34,W*.08),0,7);g.fill();g.fillStyle='#d8cdb4';g.beginPath();g.arc(W*.76-8,hy*.42-6,6,0,7);g.arc(W*.76+9,hy*.42+8,4,0,7);g.fill();
 g.fillStyle='#16101c';g.fillRect(0,hy,W,H-hy)}
function city(){const S=12,base=Math.floor(dist/S),cols=['#241a38','#1d2438','#2d1d2f','#1a2a36'];
 for(let i=16;i>=0;i--){const idx=base+i,z=i*S-(dist%S);if(z<-3)continue;
  for(const sd of[-1,1]){const r=hash(idx*2+(sd>0)),h=4+r*8,e=sd<0?-.9:2.9,s0=sc(z),s1=sc(z+S),
   xa=X(e,z),xb=X(e,z+S),ya=Y(z),yb=Y(z+S),bw=3.2*LW,col=cols[(r*40|0)%4],
   Q=(u,v)=>{const zz=z+u*S;return[X(e,zz),Y(zz)-v*h*U*sc(zz)]};
   poly([xa,ya,xb,yb,xb,yb-h*U*s1,xa,ya-h*U*s0],col);
   g.save();g.translate(xa,ya);g.scale(s0,s0);g.fillStyle=PAT.brick;g.globalAlpha=.35;g.fillRect(sd<0?-bw/s0*s0:0,-h*U,bw,h*U);g.restore();g.globalAlpha=1;
   g.fillStyle=col;g.fillRect(sd<0?xa-bw*s0:xa,ya-h*U*s0,bw*s0,h*U*s0);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(sd<0?xa-bw*s0:xa,ya-h*U*s0,bw*s0,h*U*s0);
   const rows=Math.floor(h);for(let ro=0;ro<rows;ro++)for(let c=0;c<4;c++){if(hash(idx*50+ro*7+c+sd)>.55){const u0=.08+c*.23,v0=(ro+.25)/h,v1=(ro+.7)/h,a=Q(u0,v0),b=Q(u0+.14,v0),c2=Q(u0+.14,v1),d=Q(u0,v1);poly([a[0],a[1],b[0],b[1],c2[0],c2[1],d[0],d[1]],hash(idx+ro+c)>.5?'#ffd27a':'#7ac8ff')}}
   if(r>.55&&h>7){const a=Q(.1,.62),b=Q(.9,.62),fs=Math.max(4,.85*U*sc(z+S/2));g.save();g.font=`900 ${fs}px sans-serif`;const tw=g.measureText('САРАТОВ').width;g.translate(a[0],a[1]);g.transform((b[0]-a[0])/tw,(b[1]-a[1])/tw,0,1,0,0);g.fillStyle='#ff3da8';g.shadowColor='#ff3da8';g.shadowBlur=z<80?10:0;g.fillText('САРАТОВ',0,0);g.restore()}
   const fa=Math.min(.85,z/150);g.fillStyle=`rgba(106,52,102,${fa})`;g.fillRect(sd<0?xa-bw*s0:xa,ya-h*U*s0,bw*s0,h*U*s0);poly([xa,ya,xb,yb,xb,yb-h*U*s1,xa,ya-h*U*s0],`rgba(106,52,102,${fa})`)}
  const lx=[-.7,2.7];lx.forEach(l=>{const x=X(l,z),y=Y(z),s=sc(z);g.fillStyle='#555';g.fillRect(x-1.5*s,y-2.2*U*s,3*s,2.2*U*s);g.fillStyle='#ffe9a8';g.beginPath();g.arc(x,y-2.25*U*s,Math.max(1,.22*U*s),0,7);g.fill()})}}
function road(){const zf=170;poly([X(-.9,zf),Y(zf),X(2.9,zf),Y(zf),X(2.9,-8),Y(-8),X(-.9,-8),Y(-8)],'#3a3444');
 const P1=[X(-.5,zf),Y(zf),X(2.5,zf),Y(zf),X(2.5,-8),Y(-8),X(-.5,-8),Y(-8)];poly(P1,'#26212e');
 g.save();g.beginPath();g.moveTo(P1[0],P1[1]);for(let i=2;i<8;i+=2)g.lineTo(P1[i],P1[i+1]);g.clip();g.globalAlpha=.28;g.fillStyle=PAT.asp;g.fillRect(0,hy,W,H);g.restore();
 for(let k=0;k<44;k++){const z=k*4-(dist%4)-4;if(z<-6)continue;poly([X(-.45,z),Y(z),X(2.45,z),Y(z),X(2.45,z+1),Y(z+1),X(-.45,z+1),Y(z+1)],'#4a3a30')}
 for(let l=0;l<3;l++)for(const o of[-.22,.22]){const a=l+o;poly([X(a-.035,zf),Y(zf),X(a+.035,zf),Y(zf),X(a+.035,-8),Y(-8),X(a-.035,-8),Y(-8)],'#8a8a9a')}
 const gr=g.createLinearGradient(0,hy,0,hy+(py-hy)*.3);gr.addColorStop(0,'#8a4a60');gr.addColorStop(1,'rgba(138,74,96,0)');g.fillStyle=gr;g.fillRect(0,hy,W,(py-hy)*.3)}
function box(l,z,len,w,y0,y1,c){const zz=Math.max(z,-2.5),z1=z+len;if(z1<-2.5)return;const s0=sc(zz),s1=sc(z1),xa=X(l-w,zz),xb=X(l+w,zz),fa=X(l-w,z1),fb=X(l+w,z1),g0=Y(zz),g1=Y(z1),b0=g0-y0*U*s0,t0=g0-y1*U*s0,b1=g1-y0*U*s1,t1=g1-y1*U*s1;
 poly([xa,t0,xb,t0,fb,t1,fa,t1],c.top);if(l<1)poly([xb,t0,fb,t1,fb,b1,xb,b0],c.side);else if(l>1)poly([xa,t0,fa,t1,fa,b1,xa,b0],c.side);
 poly([xa,t0,xb,t0,xb,b0,xa,b0],c.front);return[xa,t0,xb-xa,b0-t0,s0,z>=-2.5]}
const TR=[{top:'#d05a5a',side:'#8e2f3a',front:'#b8404a'},{top:'#5a8ad0',side:'#2f4a8e',front:'#4068b8'},{top:'#6ab07a',side:'#2f6a45',front:'#40905a'}];
function ents(){const L=E.slice().sort((a,b)=>b.z-a.z);
 for(const e of L){if(e.z>165)continue;g.globalAlpha=Math.min(1,(165-e.z)/40);
  if(e.t=='train'){const c=TR[(e.len|0)%3],r=box(e.l,e.z,e.len,.46,.15,2.1,c);if(r&&r[5]){const[x,y,w,h]=r;g.fillStyle='#1a2030';g.fillRect(x+w*.1,y+h*.12,w*.8,h*.32);g.fillStyle='#ffe58a';g.beginPath();g.arc(x+w*.18,y+h*.82,w*.07,0,7);g.arc(x+w*.82,y+h*.82,w*.07,0,7);g.fill();g.fillStyle='#fff3';g.fillRect(x,y+h*.58,w,h*.06)}}
  else if(e.t=='bar'){const r=box(e.l,e.z,e.len,.46,0,.55,{top:'#f0c020',side:'#a07a10',front:'#222'});if(r&&r[5]){const[x,y,w,h]=r;g.fillStyle='#f0c020';for(let i=0;i<6;i+=2)g.fillRect(x+w*i/6,y,w/6,h)}}
  else if(e.t=='hang'){const c={top:'#888',side:'#555',front:'#666'};box(e.l-.42,e.z,e.len,.05,0,1,c);box(e.l+.42,e.z,e.len,.05,0,1,c);const r=box(e.l,e.z,e.len,.5,1,1.45,{top:'#e0e0e0',side:'#999',front:'#c02030'});if(r&&r[5]){g.fillStyle='#fff';g.font=`900 ${Math.max(6,r[3]*.7)}px sans-serif`;g.textAlign='center';g.fillText('СТОП',r[0]+r[2]/2,r[1]+r[3]*.78)}}
  else{const x=X(e.l,e.z),s=sc(e.z),y=Y(e.z)-e.y*U*s;
   if(e.t=='c'){const w=Math.abs(Math.cos(tt*5+(e.ph||0)))*.2+.04;g.fillStyle='#8a6a00';g.beginPath();g.ellipse(x,y,w*U*s*1.2+1,.24*U*s,0,0,7);g.fill();g.fillStyle='#ffd23a';g.beginPath();g.ellipse(x,y,w*U*s,.2*U*s,0,0,7);g.fill()}
   else{g.fillStyle=e.t=='m'?'#c33':'#39f';g.beginPath();g.arc(x,y,.4*U*s,0,7);g.fill();g.font=`${.5*U*s}px sans-serif`;g.textAlign='center';g.fillText(e.t=='m'?'🧲':'🛡️',x,y+.18*U*s)}}}
 g.globalAlpha=1}
/* ---------- персонажи ---------- */
function rig(cx,fy,k,t,o){const s=Math.sin(t*14),c=Math.cos(t*14),air=o.air;
 g.save();g.translate(cx,fy);g.scale(k,-k);g.lineCap='round';g.lineJoin='round';if(o.slide){g.scale(1,.55);}
 if(o.kag)for(let j=-1;j<=1;j++){g.strokeStyle=j?'#8d0c20':'#e0203a';g.lineWidth=.11;g.beginPath();g.moveTo(0,1);g.bezierCurveTo(j*.4,1.2+Math.sin(t*7+j)*.15,j*.7+Math.sin(t*5+j)*.12,.9+Math.cos(t*6+j)*.2,j*.95+Math.sin(t*8)*.1,1.3+Math.sin(t*6+j)*.22);g.stroke()}
 for(const sg of[-1,1]){g.strokeStyle=o.pants;g.lineWidth=.17;g.beginPath();g.moveTo(sg*.12,.85);const fx=sg*.13+(air?0:sg*s*.05),fyy=air?.3+(sg>0?.15:0):Math.max(0,sg*c*.32);g.lineTo(fx,fyy+.05);g.stroke();g.fillStyle=o.shoe;g.beginPath();g.ellipse(fx,fyy+.04,.11,.06,0,0,7);g.fill()}
 g.fillStyle=o.cloth;g.beginPath();g.moveTo(-.28,.78);g.lineTo(.28,.78);g.lineTo(.3,1.38);g.lineTo(-.3,1.38);g.closePath();g.fill();
 if(o.zom){g.fillStyle=o.pants;for(let i=0;i<5;i++){g.beginPath();g.moveTo(-.28+i*.12,.78);g.lineTo(-.22+i*.12,.62+(i%2)*.1);g.lineTo(-.16+i*.12,.78);g.fill()}g.fillStyle='#7a0a0a';g.fillRect(-.12,1,.2,.18)}else{g.strokeStyle='#ffffff30';g.lineWidth=.03;g.beginPath();g.moveTo(0,.8);g.lineTo(0,1.36);g.stroke()}
 for(const sg of[-1,1]){g.strokeStyle=o.zom?o.skin:o.cloth;g.lineWidth=.13;g.beginPath();g.moveTo(sg*.29,1.3);const hx=sg*(o.zom?.2:.36),hyy=o.zom?1.65+Math.sin(t*8+sg)*.08:.95+sg*c*.14;g.lineTo(hx,hyy);g.stroke();g.fillStyle=o.skin;g.beginPath();g.arc(hx,hyy,.07,0,7);g.fill()}
 g.fillStyle=o.skin;g.beginPath();g.arc(0,1.6,.23,0,7);g.fill();
 if(o.hair){g.fillStyle='#f4f4f8';g.beginPath();g.arc(-.03,1.63,.255,.5,Math.PI*1.45);g.lineTo(-.03,1.63);g.fill();
  for(let i=0;i<9;i++){const a=.2+i*.33,r=.24,tx=-.03+Math.cos(a)*(r+.14+Math.sin(t*9+i)*.04),ty=1.63+Math.sin(a)*(r+.14+Math.sin(t*9+i)*.04);g.beginPath();g.moveTo(-.03+Math.cos(a-.2)*r,1.63+Math.sin(a-.2)*r);g.lineTo(tx,ty);g.lineTo(-.03+Math.cos(a+.2)*r,1.63+Math.sin(a+.2)*r);g.fill()}
  g.beginPath();g.moveTo(.04,1.78);g.lineTo(.2,1.64);g.lineTo(.22,1.8);g.fill()}
 else{g.strokeStyle='#2a3a20';g.lineWidth=.03;for(let i=0;i<4;i++){g.beginPath();g.moveTo(-.1+i*.07,1.8);g.lineTo(-.12+i*.07,1.9);g.stroke()}}
 g.fillStyle=o.eye+'55';g.beginPath();g.arc(.13,1.58,.11+Math.sin(t*10)*.01,0,7);g.fill();
 g.fillStyle='#000';g.beginPath();g.ellipse(.13,1.58,.065,.055,0,0,7);g.fill();g.fillStyle=o.eye;g.beginPath();g.arc(.13,1.58,.035,0,7);g.fill();
 if(o.zom){g.fillStyle='#300';g.fillRect(.04,1.43,.15,.06);g.fillStyle='#ddd';g.fillRect(.06,1.48,.02,.03);g.fillRect(.11,1.48,.02,.03)}else{g.strokeStyle='#0008';g.lineWidth=.025;g.beginPath();g.moveTo(.06,1.43);g.lineTo(.17,1.44);g.stroke();g.strokeStyle='#0006';g.beginPath();g.moveTo(.05,1.66);g.lineTo(.2,1.64);g.stroke();
  g.strokeStyle='#e0203a';g.lineWidth=.025;g.beginPath();g.moveTo(.13,1.58);g.lineTo(.13-.35-Math.sin(t*20)*.04,1.6);g.stroke()}
 g.restore()}
const HERO={skin:'#ecd9cc',cloth:'#17171f',pants:'#222230',shoe:'#eee',eye:'#ff1830',hair:1,kag:1};
const ZOM={skin:'#7a9a6a',cloth:'#4a5a3a',pants:'#2a2a1a',shoe:'#333',eye:'#ffe030',zom:1};
function chars(){const run=st!='over',zk=U*sc(-gap)*1.1,zx=X(zl,-gap),zy=Y(-gap);
 g.fillStyle='#0006';g.beginPath();g.ellipse(zx,zy,zk*.4,zk*.12,0,0,7);g.fill();rig(zx,zy+Math.sin(tt*14)*2,zk,run?tt:0,ZOM);
 const px=W/2+(P.x-1)*LW,fy=py-P.h*U;g.fillStyle='#0007';g.beginPath();g.ellipse(px,py,U*.35*(1-P.h*.2),U*.1,0,0,7);g.fill();
 if(shd>0){g.strokeStyle=`rgba(100,200,255,${.5+.3*Math.sin(tt*10)})`;g.lineWidth=3;g.beginPath();g.arc(px,fy-U*.8,U*.95,0,7);g.stroke()}
 if(inv>0&&Math.floor(tt*16)%2)g.globalAlpha=.35;
 rig(px,fy,U,st=='over'?0:tt,Object.assign({},HERO,{air:P.h>0.05,slide:P.sl>0}));g.globalAlpha=1}
function draw(){g.save();if(shake>0)g.translate((Math.random()-.5)*shake*22,(Math.random()-.5)*shake*22);
 sky();city();road();ents();chars();PT.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});g.globalAlpha=1;
 if(st=='play'&&gap<4.5){g.fillStyle=`rgba(200,0,0,${(4.5-gap)*.07+Math.sin(tt*8)*.03})`;g.fillRect(0,0,W,H)}g.restore();
 if(score!=lastS){$('#sc').textContent=score;lastS=score}if(coins!=lastC){$('#cn').firstChild.textContent='🪙 '+coins;lastC=coins}
 $('#pw').textContent=(mag>0?'🧲'+Math.ceil(mag)+'с ':'')+(shd>0?'🛡️'+Math.ceil(shd)+'с':'');
 $('#mb').textContent=best?'Рекорд: '+best+'   🪙 '+bank:''}
let lt=performance.now();
(function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;update(dt);draw();requestAnimationFrame(loop)})(lt);
</script></body></html>
