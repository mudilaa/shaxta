<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахта</title>
<style>
:root{--bg:#f3efe8;--card:#fff;--tx:#241c12;--mu:#7a6c58;--ac:#e08a1e;--ok:#2e9e4f;--bad:#d64545;--bd:#e2d9c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130e;--card:#252017;--tx:#f3e9d6;--mu:#a99a80;--bd:#3a3225;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130e;--card:#252017;--tx:#f3e9d6;--mu:#a99a80;--bd:#3a3225;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;touch-action:manipulation}
header{padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
#money{font-size:24px;font-weight:800;color:var(--ac)}
#buffs{font-size:12px;color:var(--mu);min-height:16px}
main{flex:1;overflow-y:auto;padding:12px;max-width:600px;width:100%;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:7px 0;font-size:11px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row small,.mu{color:var(--mu);font-size:13px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;white-space:nowrap}
button.b:disabled{opacity:.4}
button.g{background:var(--ok)}
h3{margin:4px 0 8px;font-size:15px}
#scene{position:relative;height:320px;border-radius:16px;overflow:hidden;margin-bottom:10px;background:radial-gradient(circle at 50% 45%,#5a4c3c,#1b1610);border:2px solid #0006}
#rockc{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:150px}
#rock{width:150px;height:150px;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;background:radial-gradient(circle at 35% 30%,#b0a594,#5a5045 70%);box-shadow:0 8px 0 #2c261f;position:relative;touch-action:manipulation;transition:transform .1s}
#rock span{position:absolute;font-size:24px;pointer-events:none}
#rock.hit{animation:hit .12s}
@keyframes hit{50%{filter:brightness(1.5);margin-top:4px}}
#hp{width:120px;height:9px;margin:14px auto 0;background:#0007;border-radius:5px;overflow:hidden}
#hpf{display:block;height:100%;background:var(--bad);width:100%}
.mw{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;animation:pop .5s backwards}
.mn{display:block;font-size:28px;animation:sw .6s ease-in-out infinite alternate}
@keyframes sw{to{transform:translate(var(--dx),var(--dy)) rotate(-18deg)}}
@keyframes pop{from{transform:scale(0) translateY(-40px)}}
.fx{position:absolute;pointer-events:none;font-weight:800;font-size:18px;color:#ffd36b;animation:fl .9s forwards;text-shadow:0 1px 3px #000}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:2px solid var(--bd);border-radius:10px;padding:6px 9px;background:var(--bg);color:var(--tx);font-size:13px}
.chip.on{border-color:var(--ac);background:var(--ac);color:#fff}
.chip:disabled{opacity:.5}
.it{flex:1;min-width:0;text-align:center;border:2px solid var(--bd);border-radius:12px;padding:8px 2px;background:var(--bg)}
.it small{font-size:10px;display:block}
.big{font-size:34px}
#wheel{position:relative;width:170px;height:170px;flex:none}
#wheel svg{width:100%;height:100%}
#ptr2{position:absolute;inset:0;transform:rotate(0)}
#ptr2 b{position:absolute;top:1px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:18px solid var(--tx)}
#pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:800}
#pc small{font-size:12px;color:var(--mu);font-weight:400}
#res{text-align:center;font-weight:700;min-height:22px;margin-top:6px}
.met{position:fixed;top:-60px;font-size:44px;z-index:9;animation:fall 7s linear forwards;filter:drop-shadow(0 0 10px #ffb200)}
@keyframes fall{to{top:105%}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style></head><body>
<header><div id="money"></div><div id="buffs"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const ORES=[["Уголь","⚫",2],["Медь","🟤",5],["Железо","⚙️",12],["Серебро","🥈",30],["Золото","🥇",80],["Рубин","🔴",200],["Алмаз","💎",500],["Мифрил","🟢",1500]];
const PK=[["Деревянная",0],["Каменная",150],["Железная",1000],["Стальная",6000],["Золотая",35000],["Алмазная",200000],["Мифриловая",1500000]];
const MN=[["Шахтёр","👷",100,.5],["Бурильщик","🧑‍🏭",1200,3],["Робот","🤖",15000,20],["Экскаватор","🚜",180000,120],["Дракон","🐉",2500000,800],["Пришелец","👽",40000000,5000]];
const BF=[["x2","Двойная добыча","⚡","×2 добычи, 60 сек",400,60],["sp","Энергетик","🥤","Шахтёры ×2, 60 сек",600,60],["lk","Удача","🍀","Редкие руды чаще, 60 сек",800,60],["fv","Золотая лихорадка","🔥","100% шанс крита, 30 сек",1500,30]];
const UPS=[["crit","🎯","Критический удар","+2% шанс крита (×5)",200,1.6,25],["spd","🏃","Тренировка","+10% скорость шахтёров",800,1.7,20],["lck","🍀","Нюх на руду","Редкие руды чаще",1500,2,10],["brk","💥","Мастер обвалов","+50% награды за обвал",1000,1.8,20],["sell","🤝","Торговец","+10% к цене продажи",500,2.2,10]];
const def=()=>({money:0,inv:Array(8).fill(0),power:1,miners:[0,0,0,0,0,0],pick:0,sell:0,crit:0,spd:0,lck:0,brk:0,auto:0,tok:0,earn:0,broken:0,b:{x2:0,sp:0,lk:0,fv:0}});
let S=def();
try{const o=JSON.parse(localStorage.getItem('mine_v2'));if(o&&o.inv){S=Object.assign(def(),o);S.b=Object.assign(def().b,o.b)}}catch(e){}
const save=()=>{try{localStorage.setItem('mine_v2',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const UG={s:0,n:1,t:1,p:50,spin:false,msg:""};
const R={hp:1,max:1};
let tab=0,acc=0;
const fmt=n=>{n=Math.floor(n);if(n<1000)return n;const u=["","К","М","Б","Т","Qa"];let i=0,v=n;while(v>=1000&&i<5){v/=1000;i++}return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+u[i]};
const on=k=>S.b[k]>Date.now();
const mult=()=>1+.5*S.pick, gm=()=>1+.25*S.tok;
const critP=()=>Math.min(1,.02*S.crit+(on('fv')?1:0));
const tapN=()=>Math.max(1,Math.round(S.power*mult()*gm()))*(on('x2')?2:1);
const nMin=()=>S.miners.reduce((a,c)=>a+c,0);
const rate=()=>S.miners.reduce((a,c,i)=>a+c*MN[i][3],0)*mult()*gm()*(1+.1*S.spd)*(on('x2')?2:1)*(on('sp')?2:1);
const price=i=>Math.floor(ORES[i][2]*(1+.1*S.sell));
const powerCost=()=>Math.floor(30*Math.pow(1.45,S.power-1));
const minerCost=i=>Math.floor(MN[i][2]*Math.pow(1.15,S.miners[i]));
const upCost=u=>Math.floor(u[4]*Math.pow(u[5],S[u[0]]));
const bfCost=i=>BF[i][4]*(1+S.pick*S.pick);
const dynCost=()=>300*(1+S.pick*S.pick);
const total=()=>S.inv.reduce((a,c,i)=>a+c*price(i),0);
const rebGain=()=>Math.floor(Math.sqrt(S.earn/1e6));
function drop(){const mx=Math.min(7,S.pick+1),r=Math.max(.3,.6-.02*S.lck-(on('lk')?.15:0));let w=[],t=0;for(let i=0;i<=mx;i++){const x=Math.pow(r,mx-i);w.push(x);t+=x}let q=Math.random()*t;for(let i=0;i<=mx;i++){q-=w[i];if(q<=0)return i}return mx}
function mine(n){n=Math.floor(n);if(n<1)return 0;const k=Math.min(n,30),q=Math.floor(n/k),r=n-q*k;let last=0;for(let i=0;i<k;i++){last=drop();S.inv[last]+=q+(i<r?1:0)}return last}
function addM(v){S.money+=v;S.earn+=v}
function pay(c){if(S.money<c)return false;S.money-=c;return true}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function buy(t,i){
 if(t=='power'){if(pay(powerCost()))S.power++}
 else if(t=='miner'){if(pay(minerCost(i)))S.miners[i]++}
 else if(t=='pick'){if(i==S.pick+1&&pay(PK[i][1]))S.pick=i}
 else if(t=='up'){const u=UPS[i];if(S[u[0]]<u[6]&&pay(upCost(u)))S[u[0]]++}
 else if(t=='buff'){if(pay(bfCost(i))){const k=BF[i][0];S.b[k]=Math.max(Date.now(),S.b[k])+BF[i][5]*1000}}
 else if(t=='dyn'){if(pay(dynCost())){mine(tapN()*50);dmg(R.max*.5)}}
 else if(t=='auto'){if(S.auto==0){if(pay(5000))S.auto=2}else S.auto=S.auto==2?1:2}
 save();render()}
function sellOre(i){addM(S.inv[i]*price(i));S.inv[i]=0;save();render()}
function sellAll(q){for(let i=0;i<8;i++){addM(S.inv[i]*price(i));S.inv[i]=0}if(!q){save();render()}}
function rebirth(){const g=rebGain();if(g<1)return;if(!confirm('Перерождение: сброс прогресса, но +'+g+' 🔄 (каждый даёт +25% к добыче навсегда). Продолжить?'))return;S=Object.assign(def(),{tok:S.tok+g});save();newRock();render()}
function newRock(){R.max=Math.floor(12+S.broken*.8);R.hp=R.max;rockUI()}
function rockUI(){const r=$('#rock');if(!r)return;r.style.transform=`scale(${.72+.28*Math.max(0,R.hp)/R.max})`;$('#hpf').style.width=Math.max(0,R.hp/R.max*100)+'%'}
function dmg(d){R.hp-=d;if(R.hp<=0){const n=Math.floor((tapN()*10+rate()*8)*(1+.5*S.brk));mine(n);S.broken++;toast('💥 Обвал! +'+fmt(n)+' руды');newRock();const r=$('#rock');if(r){r.style.borderRadius=[0,0,0,0].map(()=>40+Math.random()*20+'%').join(' ')+' / '+[0,0,0,0].map(()=>40+Math.random()*20+'%').join(' ')}}rockUI()}
function fx(t,x,y){const sc=$('#scene');if(!sc)return;const f=document.createElement('div');f.className='fx';f.textContent=t;f.style.left=(x??30+Math.random()*(sc.clientWidth-110))+'px';f.style.top=(y??40+Math.random()*180)+'px';sc.appendChild(f);setTimeout(()=>f.remove(),900)}
function minersHTML(){let l=[];for(let i=5;i>=0;i--)for(let k=0;k<Math.min(S.miners[i],4);k++)l.push(MN[i][1]);l=l.slice(0,12);return l.map((e,i)=>{const a=(i/l.length)*Math.PI*2+.3,x=Math.cos(a)*125,y=Math.sin(a)*118;return `<div class="mw" style="left:calc(50% + ${x.toFixed(0)}px);top:calc(46% + ${y.toFixed(0)}px);animation-delay:${i*.08}s"><span class="mn" style="--dx:${(-x*.1).toFixed(0)}px;--dy:${(-y*.1).toFixed(0)}px;animation-delay:${(i%4)*.15}s">${e}</span></div>`}).join('')}
const TABS=[["⛏️","Шахта"],["🎒","Рюкзак"],["🛠️","Прокачка"],["🎰","Апгрейдер"],["🛒","Магазин"]];
function render(){
 $('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};render()"><span>${t[0]}</span>${t[1]}</button>`).join('');
 let h='';
 if(tab==0){
  const e1=ORES[Math.min(7,S.pick+1)][1],e2=ORES[Math.min(7,S.pick)][1];
  h=`<div id="scene">${minersHTML()}<div id="rockc"><div id="rock"><span style="left:18%;top:20%">${e1}</span><span style="left:58%;top:16%">${e2}</span><span style="left:38%;top:48%">${e1}</span><span style="left:66%;top:56%">${e2}</span><span style="left:16%;top:62%">${e2}</span></div><div id="hp"><i id="hpf"></i></div></div></div>
  <div class="card"><div class="row"><small>За удар</small><b>${fmt(tapN())}</b></div>
  <div class="row"><small>Шанс крита ×5</small><b>${Math.round(critP()*100)}%</b></div>
  <div class="row"><small>Авто-добыча (${nMin()} шахтёров)</small><b>${fmt(rate())}/с</b></div>
  <div class="row"><small>Кирка</small><b>${PK[S.pick][0]}</b></div>
  <div class="row"><small>Обвалов / бонус множитель</small><b>${fmt(S.broken)} / ×${gm().toFixed(2)}</b></div></div>
  <p class="mu" style="text-align:center">Бей по камню! Шахтёры помогают. Иногда падает метеорит 🌠 — лови.</p>
  <p style="text-align:center"><button class="b" style="background:var(--bad)" onclick="if(confirm('Сбросить ВЕСЬ прогресс?')){S=def();save();newRock();render()}">Сброс игры</button></p>`;
 }else if(tab==1){
  h=`<div class="card row"><div><b>Всего: <span data-total></span> 💰</b><br><small>Торговец: +${S.sell*10}%</small></div><button class="b g" onclick="sellAll()">Продать всё</button></div>`+
  ORES.map((o,i)=>`<div class="card row"><div style="font-size:28px">${o[1]}</div><div style="flex:1"><b>${o[0]}</b><br><small>${price(i)} 💰 за шт.</small></div><b data-inv="${i}"></b><button class="b" onclick="sellOre(${i})">Продать</button></div>`).join('');
 }else if(tab==2){
  h=`<div class="card"><h3>💪 Сила удара (ур. ${S.power})</h3><div class="row"><small>+1 руда за удар</small><button class="b" ${S.money<powerCost()?'disabled':''} onclick="buy('power')">${fmt(powerCost())} 💰</button></div></div>
  <div class="card"><h3>✨ Умения</h3>`+UPS.map((u,i)=>{const mx=S[u[0]]>=u[6];return `<div class="row" style="margin-bottom:8px"><div>${u[1]} <b>${u[2]}</b> <small>${S[u[0]]}/${u[6]}</small><br><small>${u[3]}</small></div><button class="b" ${(mx||S.money<upCost(u))?'disabled':''} onclick="buy('up',${i})">${mx?'МАКС':fmt(upCost(u))+' 💰'}</button></div>`}).join('')+`</div>
  <div class="card"><h3>👥 Шахтёры</h3>`+MN.map((m,i)=>`<div class="row" style="margin-bottom:8px"><div>${m[1]} <b>${m[0]}</b> ×${S.miners[i]}<br><small>${fmt(m[3])} руды/с каждый</small></div><button class="b" ${S.money<minerCost(i)?'disabled':''} onclick="buy('miner',${i})">${fmt(minerCost(i))} 💰</button></div>`).join('')+`</div>
  <div class="card"><h3>⛏️ Кирки</h3>`+PK.map((p,i)=>{if(i==0)return'';const own=S.pick>=i,nx=i==S.pick+1;return `<div class="row" style="margin-bottom:8px"><div><b>${p[0]}</b><br><small>×${1+.5*i} добыча, руда до ${ORES[Math.min(7,i+1)][1]}</small></div>${own?'<b style="color:var(--ok)">✔</b>':`<button class="b" ${(!nx||S.money<p[1])?'disabled':''} onclick="buy('pick',${i})">${fmt(p[1])} 💰</button>`}</div>`}).join('')+`</div>`;
 }else if(tab==3){
  const s=UG.s;if(UG.t<=s)UG.t=s+1;UG.n=Math.max(1,Math.min(UG.n,Math.max(S.inv[s],1)));
  const sv=UG.n*ORES[s][2],m=Math.floor(sv*1.05/(ORES[UG.t][2]*UG.p/100)),C=565.5;
  h=`<div class="card"><div class="row" style="gap:6px">
  <div class="it"><small>ВАША СТАВКА</small><div class="big">${ORES[s][1]}</div><b>${fmt(UG.n)}×</b><small>${ORES[s][0]}</small></div>
  <div id="wheel"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="90" fill="none" stroke="var(--bad)" stroke-width="16"/><circle cx="110" cy="110" r="90" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="${(UG.p*C/100).toFixed(1)} ${C}" transform="rotate(-90 110 110)"/></svg><div id="ptr2"><b></b></div><div id="pc">${UG.p}%<small>шанс</small></div></div>
  <div class="it"><small>ЦЕЛЬ</small><div class="big">${ORES[UG.t][1]}</div><b>${fmt(m)}×</b><small>${ORES[UG.t][0]}</small></div></div>
  <button class="b" style="width:100%;margin-top:10px" ${(UG.spin||S.inv[s]<UG.n||m<1)?'disabled':''} onclick="spin()">🎰 ПРОКАЧАТЬ</button><div id="res">${m<1?'Мало руды для этой цели':UG.msg}</div></div>
  <div class="card"><h3>Ставка</h3><div class="chips">${ORES.slice(0,7).map((r,i)=>`<button class="chip ${i==s?'on':''}" onclick="UG.s=${i};UG.n=1;render()">${r[1]} ${fmt(S.inv[i])}</button>`).join('')}</div>
  <div class="chips">${[1,10,100].map(n=>`<button class="chip" onclick="UG.n=${n};render()">${n}</button>`).join('')}<button class="chip" onclick="UG.n=Math.max(1,S.inv[UG.s]);render()">Всё</button></div>
  <h3>Цель</h3><div class="chips">${ORES.map((r,i)=>i>s?`<button class="chip ${i==UG.t?'on':''}" onclick="UG.t=${i};render()">${r[1]}</button>`:'').join('')}</div>
  <h3>Шанс</h3><div class="chips">${[20,50,70].map(p=>`<button class="chip ${p==UG.p?'on':''}" onclick="UG.p=${p};render()">${p}%</button>`).join('')}</div>
  <div class="mu">Чем ниже шанс — тем больше награда. Проигрыш сжигает ставку.</div></div>`;
 }else{
  const g=rebGain();
  h=`<div class="card"><h3>Баффы</h3>`+BF.map((b,i)=>`<div class="row" style="margin-bottom:8px"><div>${b[2]} <b>${b[1]}</b><br><small>${b[3]}</small><br><small data-buff="${b[0]}"></small></div><button class="b" ${S.money<bfCost(i)?'disabled':''} onclick="buy('buff',${i})">${fmt(bfCost(i))} 💰</button></div>`).join('')+
  `<div class="row" style="margin-bottom:8px"><div>🧨 <b>Динамит</b><br><small>50 ударов сразу + ломает полкамня</small></div><button class="b" ${S.money<dynCost()?'disabled':''} onclick="buy('dyn')">${fmt(dynCost())} 💰</button></div>
  <div class="row"><div>🤖 <b>Авто-продажа</b><br><small>Продаёт всю руду каждую секунду</small></div><button class="b" ${(S.auto==0&&S.money<5000)?'disabled':''} onclick="buy('auto')">${S.auto==0?'5К 💰':S.auto==2?'ВКЛ':'ВЫКЛ'}</button></div></div>
  <div class="card"><h3>🔄 Перерождение (${S.tok})</h3><div class="mu">Сброс всего, но каждый 🔄 даёт +25% к добыче навсегда. Заработано в этом забеге: ${fmt(S.earn)} 💰. Нужно от 1М.</div><button class="b" style="width:100%;margin-top:8px" ${g<1?'disabled':''} onclick="rebirth()">Переродиться: +${g} 🔄</button></div>`;
 }
 $('#main').innerHTML=h;upd();rockUI()}
function spin(){
 if(UG.spin)return;const s=UG.s,n=UG.n;if(S.inv[s]<n)return;
 const m=Math.floor(n*ORES[s][2]*1.05/(ORES[UG.t][2]*UG.p/100));if(m<1)return;
 S.inv[s]-=n;UG.spin=true;save();
 const p=UG.p,win=Math.random()*100<p,pos=win?p*(.04+Math.random()*.92):p+(100-p)*(.04+Math.random()*.92),el=$('#ptr2'),t=UG.t;
 el.style.transition='none';el.style.transform='rotate(0deg)';void el.offsetWidth;
 el.style.transition='transform 4s cubic-bezier(.12,.6,.1,1)';el.style.transform=`rotate(${360*5+pos*3.6}deg)`;
 document.querySelectorAll('.card button').forEach(b=>b.disabled=true);
